# ──────────────────────────────────────────────────────────────────────────────
# Adopte Ton Dev — Config Nginx
#
# Remplacer VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR par votre vrai sous-domaine
# Exemple : atd.mondomaine.fr
#
# Étapes :
#   1. Copier ce fichier dans /etc/nginx/sites-available/adopte-ton-dev
#   2. Remplacer VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR
#   3. ln -s /etc/nginx/sites-available/adopte-ton-dev /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR;

    # Certbot redirigera automatiquement vers HTTPS après l'obtention du certificat
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR;

    # ── Certificat SSL (rempli automatiquement par Certbot) ──────────────────
    # ssl_certificate     /etc/letsencrypt/live/VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Sécurité ─────────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 10M;

    # ── API Gateway (NestJS) — /api/v1/* ──────────────────────────────────────
    location /api/v1 {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Next.js (web app) — tout le reste (y compris /api/auth/*) ────────────
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
