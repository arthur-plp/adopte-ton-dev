# ──────────────────────────────────────────────────────────────────────────────
# Adopte Ton Dev — Config Nginx
#
# Remplacer VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR par votre vrai sous-domaine
# Exemple : atd.mondomaine.fr
#
# Étapes :
#   1. Copier ce fichier dans /etc/nginx/sites-available/adopte-ton-dev
#   2. Remplacer VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR
#   3. ln -s /etc/nginx/sites-available/adopte-ton-dev /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR
#
# Important : ne pas ajouter de bloc "listen 443 ssl" ici tant que le
# certificat n'existe pas — nginx refuse de démarrer si ssl_certificate
# n'est pas défini. C'est Certbot (étape 5) qui ajoute lui-même le bloc
# HTTPS et la redirection, une fois le certificat obtenu.
# ──────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name VOTRE_SOUS_DOMAINE.VOTRE_DOMAINE.FR;

    client_max_body_size 10M;

    # ── API Gateway (NestJS) — /api/v1/* ──────────────────────────────────────
    location /api/v1 {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── WebSocket temps réel (Socket.IO, hébergé par la Gateway — CLAUDE.md
    # §7/§15) — chemin par défaut du client socket.io-client, doit être
    # proxié vers la Gateway (4000) et PAS vers Next.js (sinon 404) ─────────
    location /socket.io/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── Next.js (web app) — tout le reste (y compris /api/auth/*) ────────────
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
