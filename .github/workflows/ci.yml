name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Types · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: |
          pnpm --filter auth-service exec prisma generate
          pnpm --filter jobs-svc exec prisma generate
          pnpm --filter applications-svc exec prisma generate
          pnpm --filter payment-svc exec prisma generate
          pnpm --filter api-gateway exec prisma generate
          pnpm --filter web exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Build
        run: pnpm build

      - name: Test with coverage (≥ 70% gate)
        run: pnpm test:cov

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/"
          if-no-files-found: ignore
