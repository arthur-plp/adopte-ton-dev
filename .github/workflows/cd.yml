name: CD — Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "── Git pull ──────────────────────────────"
            git pull origin main

            echo "── Build des images Docker ───────────────"
            docker compose -f infra/docker-compose.prod.yml build

            echo "── Migrations Prisma ─────────────────────"
            docker compose -f infra/docker-compose.prod.yml run --rm auth-service npx prisma migrate deploy
            docker compose -f infra/docker-compose.prod.yml run --rm jobs-svc npx prisma migrate deploy
            docker compose -f infra/docker-compose.prod.yml run --rm applications-svc npx prisma migrate deploy
            docker compose -f infra/docker-compose.prod.yml run --rm payment-svc npx prisma migrate deploy

            echo "── Redémarrage des services ──────────────"
            docker compose -f infra/docker-compose.prod.yml up -d --remove-orphans

            echo "── Nettoyage des images obsolètes ────────"
            docker image prune -f

            echo "── Statut des conteneurs ─────────────────"
            docker compose -f infra/docker-compose.prod.yml ps

            echo "✅ Déploiement terminé"
